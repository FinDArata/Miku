<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Miku icon</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Draws the classic Miku through the real engine, in the square the icon needs,
// then hands the pixels back. scripts/gen-icons.mjs drives this page in a
// headless browser, so the icon is the mascot itself and cannot drift from it.
const { BotEngine } = await import("/src/mochi/engine.ts");

/**
 * The icon's crop, in engine pixels: the head and the shoulders. The engine
 * draws the figure at 30 % of the canvas, so drawing into a canvas `size` wide
 * and cropping this box gives a bust that fills an icon.
 */
function renderAt(size) {
  // Draw large, then let the browser scale down: the engine's own canvas has no
  // antialiasing control, and the extra samples are what keep the 16 px entry
  // readable.
  const SS = 4;
  const W = size * SS;
  const c = document.createElement("canvas");
  c.width = W;
  c.height = W;
  const x = c.getContext("2d");
  const engine = new BotEngine();
  engine.setVariant("classic");
  engine.setState("idle", true);
  engine.update(1 / 60);
  engine.draw(x, W, W);

  // The bust: the head, the shoulders and enough of the tails to read as Miku,
  // centred. In engine pixels the character is centred horizontally.
  const R = W * 0.3;
  const u = R / 158;
  const cx = W / 2;
  const cy = W / 2 + R * 0.06;
  // Prototype box to keep: x 6..294, y -40..300 — the head, the shoulders and
  // the tails down to the skirt, with a little breathing room all round.
  const box = { x: 6, y: -40, w: 288, h: 340 };
  const sx = cx + (box.x - 150) * u;
  const sy = cy + (box.y - 150) * u;
  const sw = box.w * u;
  const sh = box.h * u;

  const out = document.createElement("canvas");
  out.width = size;
  out.height = size;
  const o = out.getContext("2d");
  // Keep it square: the box is taller than wide, so letterbox on the width.
  const scale = Math.min(size / sw, size / sh);
  const dw = sw * scale;
  const dh = sh * scale;
  o.drawImage(c, sx, sy, sw, sh, (size - dw) / 2, (size - dh) / 2, dw, dh);
  return out.toDataURL("image/png");
}

const sizes = JSON.parse(decodeURIComponent(new URLSearchParams(location.search).get("sizes") || "[]"));
const found = {};
for (const size of sizes) found[size] = renderAt(size);

// Hand the PNGs to the driver as text, one per line: "size<TAB>dataURL".
document.getElementById("result").textContent = sizes
  .map((s) => `${s}\t${found[s]}`)
  .join("\n");
document.title = "ready";
</script>
<pre id="result" style="display:none"></pre>
</body>
</html>
