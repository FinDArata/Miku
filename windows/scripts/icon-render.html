<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Miku icon</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Draws the classic Miku through the real engine, in the square the icon needs,
// then hands the pixels back. scripts/gen-icons.mjs drives this page in a
// headless browser, so the icon is the mascot itself and cannot drift from it.
const { BotEngine } = await import("/src/mochi/engine.ts");
const { chibiArms } = await import("/src/mochi/chibi.ts");

/**
 * The icon: Miku's face and her leek, on a teal rounded tile. The engine draws
 * the figure at 30 % of the canvas, so drawing into a canvas `size` wide and
 * cropping a box of it gives a head that fills the tile.
 */
function renderAt(size) {
  // Draw large, then let the browser scale down: the engine's own canvas has no
  // antialiasing control, and the extra samples are what keep the 16 px entry
  // readable.
  const SS = 4;
  const W = size * SS;
  const c = document.createElement("canvas");
  c.width = W;
  c.height = W;
  const x = c.getContext("2d");
  const engine = new BotEngine();
  engine.setVariant("classic");
  engine.setState("idle", true);
  engine.setHeldPose("leek");
  // The arms ease toward a pose over real time; a one-frame render has to start there.
  engine.arms = chibiArms("leek");
  engine.update(1 / 60);
  engine.draw(x, W, W);

  // The engine draws the chibi (src/mochi/chibi.ts) 440 design units wide
  // across 62 % of the canvas, its point (260, 273) on the centre.
  const R = W * 0.3;
  const u = (W * 0.62) / 440;
  const cx = W / 2;
  const cy = W / 2 + R * 0.06;
  // Design box to keep: the hair bands down to the collar, shifted right so
  // the leek she holds up beside her face stays in.
  const box = { x: 140, y: 55, w: 290, h: 290 };
  const sx = cx + (box.x - 260) * u;
  const sy = cy + (box.y - 273) * u;
  const sw = box.w * u;
  const sh = box.h * u;

  const out = document.createElement("canvas");
  out.width = size;
  out.height = size;
  const o = out.getContext("2d");
  // Teal rounded tile (Miku's #39C5BB): the head is cut at the collar, so it
  // needs a ground under it to read as an icon on any taskbar.
  o.beginPath();
  o.roundRect(0, 0, size, size, size * 0.22);
  const g = o.createLinearGradient(0, 0, 0, size);
  g.addColorStop(0, "#7fe0d6");
  g.addColorStop(1, "#39c5bb");
  o.fillStyle = g;
  o.fill();
  o.clip();
  o.drawImage(c, sx, sy, sw, sh, 0, 0, size, size);
  return out.toDataURL("image/png");
}

const sizes = JSON.parse(decodeURIComponent(new URLSearchParams(location.search).get("sizes") || "[]"));
const found = {};
for (const size of sizes) found[size] = renderAt(size);

// Hand the PNGs to the driver as text, one per line: "size<TAB>dataURL".
document.getElementById("result").textContent = sizes
  .map((s) => `${s}\t${found[s]}`)
  .join("\n");
document.title = "ready";
</script>
<pre id="result" style="display:none"></pre>
</body>
</html>
