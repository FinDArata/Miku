<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miku Notch Prototype</title>
<style>
:root {
  --teal: #39c5bb; --pink: #e8457c; --ink: #e9f6f5; --dim: #8fa3b8;
  --line: #26324c; --line2: #2d3858; --navy: #0d1322; --navy2: #18213a;
  --spring: cubic-bezier(.34, 1.45, .55, 1);
  --ease: cubic-bezier(.22, 1, .36, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #070a12;
  color: var(--ink);
  font-family: "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 16px 28px; gap: 16px;
}
h1 { font-size: 20px; font-weight: 700; align-self: stretch; max-width: 1100px; margin: 0 auto; width: 100%; }
h1 span { color: var(--teal); }
.hint { color: var(--dim); font-size: 13px; max-width: 1100px; width: 100%; line-height: 1.5; }

/* the fake desktop */
.desk {
  position: relative; width: 100%; max-width: 1100px; height: 560px; border-radius: 14px; overflow: hidden;
  background:
    radial-gradient(60% 50% at 75% 85%, rgba(232,69,124,.18), transparent 70%),
    radial-gradient(70% 60% at 20% 90%, rgba(57,197,187,.16), transparent 70%),
    linear-gradient(160deg, #18223a 0%, #10172a 55%, #0b1020 100%);
  border: 1px solid #1e2740;
}
.desk::after { /* taskbar */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
  background: rgba(8,11,20,.85); border-top: 1px solid #1e2740;
}
.window {
  position: absolute; left: 7%; top: 120px; width: 46%; height: 300px; border-radius: 10px;
  background: #121a2c; border: 1px solid #222d48; box-shadow: 0 20px 40px rgba(0,0,0,.35);
}
.window::before { content: ""; display: block; height: 28px; border-bottom: 1px solid #222d48; background: #0f1626; border-radius: 10px 10px 0 0; }
.window i { display: block; height: 8px; margin: 14px 18px; border-radius: 4px; background: #1d2740; }

/* ── the island ─────────────────────────────────────────────────────────── */
.island { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 5; }

.capsule {
  position: relative; z-index: 3;
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 5px;
  border-radius: 0 0 15px 15px;
  background: linear-gradient(#0a0f1a, #121a2b);
  box-shadow: inset 0 0 0 1px var(--line), 0 6px 18px rgba(0,0,0,.45);
  font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer;
  transition: transform .25s var(--spring), box-shadow .25s;
}
.capsule:hover { transform: translateY(1px) scale(1.03); box-shadow: inset 0 0 0 1px rgba(57,197,187,.5), 0 8px 22px rgba(0,0,0,.5); }
.capsule canvas.head { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(#1c3a4a, #0e1626); flex: none; }
.capsule .slot { display: flex; align-items: center; gap: 8px; transition: opacity .25s; }
.mono { font-family: Consolas, ui-monospace, monospace; font-size: 11.5px; }
.dimt { color: var(--dim); font-weight: 500; }
.cover { width: 20px; height: 20px; border-radius: 5px; flex: none;
  background: radial-gradient(circle at 30% 30%, #ff8fb3 0 22%, transparent 23%), radial-gradient(circle at 70% 70%, #39c5bb 0 28%, transparent 29%), linear-gradient(135deg, #2b1a4d, #1a3b5c); }
.eq { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
.eq i { width: 2.5px; height: 100%; border-radius: 1px; background: linear-gradient(var(--pink), var(--teal)); transform-origin: bottom; animation: eq .9s ease-in-out infinite; }
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}.eq i:nth-child(5){animation-delay:-.45s}.eq i:nth-child(6){animation-delay:-.75s}
@keyframes eq { 0%,100%{transform:scaleY(.3)} 25%{transform:scaleY(1)} 50%{transform:scaleY(.55)} 75%{transform:scaleY(.85)} }

/* Miku hanging under the capsule */
.under {
  position: relative; z-index: 1; margin-top: -6px; height: 92px; width: 92px;
  transform: translateY(-70px) scale(.6); opacity: 0; pointer-events: none;
  transition: transform .55s var(--spring), opacity .25s ease;
}
.under.on { transform: none; opacity: 1; pointer-events: auto; cursor: pointer; }
.under .thread { position: absolute; left: 50%; top: 0; width: 1.5px; height: 14px; background: linear-gradient(rgba(57,197,187,.8), transparent); }
.under canvas { position: absolute; left: 0; top: 2px; width: 92px; height: 92px; animation: swing 3.2s ease-in-out infinite; transform-origin: 50% 0; }
@keyframes swing { 0%,100%{transform:rotate(-2.5deg)} 50%{transform:rotate(2.5deg)} }
.sign {
  position: absolute; left: 88px; top: 34px; white-space: nowrap;
  font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 11px;
  background: #121a2b; border: 1px solid var(--b, var(--line));
  box-shadow: 0 8px 18px rgba(0,0,0,.45), 0 0 12px color-mix(in srgb, var(--b, #000) 35%, transparent);
  transform: translateX(-10px); opacity: 0; transition: transform .4s var(--spring) .15s, opacity .25s .15s;
}
.under.on .sign { transform: none; opacity: 1; }
.sign small { display: block; font-weight: 500; color: var(--dim); font-size: 10.5px; margin-top: 1px; }
.bdg { min-width: 16px; height: 16px; border-radius: 8px; font-size: 9.5px; font-weight: 800; display: inline-grid; place-items: center; padding: 0 4px; color: #06231a; margin-left: 4px; }
.sign.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{ box-shadow: 0 8px 18px rgba(0,0,0,.45), 0 0 6px rgba(255,211,107,.3);} 50%{ box-shadow: 0 8px 18px rgba(0,0,0,.45), 0 0 18px rgba(255,211,107,.9);} }

/* the notification card that grows out of the capsule */
.card {
  position: absolute; top: 0; left: 50%; z-index: 4; width: 470px;
  transform: translateX(-50%) scale(.3, .15); transform-origin: 50% 0; opacity: 0; pointer-events: none;
  border-radius: 0 0 22px 22px; background: linear-gradient(var(--navy), var(--navy2));
  box-shadow: inset 0 0 0 1px var(--line2), 0 20px 50px rgba(0,0,0,.55);
  padding: 12px 14px 12px 10px; display: flex; gap: 10px;
  transition: transform .5s var(--spring), opacity .2s ease;
}
.card.on { transform: translateX(-50%) scale(1); opacity: 1; pointer-events: auto; }
.card::before { content: ""; position: absolute; top: 0; left: 14%; right: 14%; height: 3px; border-radius: 0 0 3px 3px;
  background: linear-gradient(90deg, var(--pink), var(--c, var(--teal)), var(--pink)); box-shadow: 0 0 14px var(--c, var(--teal)); }
.card canvas { width: 78px; height: 96px; flex: none; }
.card .nb { flex: 1; min-width: 0; opacity: 0; transform: translateY(-6px); transition: opacity .25s .18s, transform .35s var(--ease) .18s; }
.card.on .nb { opacity: 1; transform: none; }
.src { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .12em; color: var(--c); }
.src .t { margin-left: auto; font: 500 10.5px Consolas, monospace; color: var(--dim); letter-spacing: 0; }
.who { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #06231a; flex: none; }
.name { font-weight: 700; font-size: 13px; }
.msg { font-size: 12.5px; margin-top: 4px; line-height: 1.35; }
.rom { font-size: 11.5px; color: var(--teal); margin-top: 2px; }
.tr { font-size: 11.5px; color: #ffb3cc; margin-top: 1px; }
.acts { display: flex; gap: 6px; margin-top: 9px; align-items: center; }
.btn { font: 700 11.5px "Segoe UI", system-ui, sans-serif; padding: 6px 12px; border-radius: 999px; border: 0; cursor: pointer; white-space: nowrap; transition: transform .12s, filter .15s; }
.btn:active { transform: scale(.94); }
.btn:hover { filter: brightness(1.12); }
.p { background: var(--teal); color: #062a28; } .s { background: #18213a; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line2); }
.input { flex: 1; min-width: 0; background: #0b1120; border: 1px solid var(--line2); border-radius: 10px; padding: 6px 10px; font-size: 11.5px; color: var(--ink); outline: none; }
.input:focus { border-color: var(--teal); }

/* the deck (opened by clicking the capsule) */
.deck {
  position: absolute; top: 0; left: 50%; z-index: 6; width: 500px; height: 240px;
  transform: translateX(-50%) scale(.26, .13); transform-origin: 50% 0; opacity: 0; pointer-events: none;
  border-radius: 0 0 22px 22px; background: linear-gradient(var(--navy), var(--navy2));
  box-shadow: inset 0 0 0 1px var(--line2), 0 20px 50px rgba(0,0,0,.55); padding: 10px 12px 12px;
  display: flex; flex-direction: column; gap: 8px; transition: transform .55s var(--spring), opacity .2s;
}
.deck.on { transform: translateX(-50%) scale(1); opacity: 1; pointer-events: auto; }
.deck::before { content: ""; position: absolute; top: 0; left: 14%; right: 14%; height: 3px; border-radius: 0 0 3px 3px;
  background: linear-gradient(90deg, var(--pink), var(--teal), var(--pink)); box-shadow: 0 0 14px rgba(57,197,187,.65); }
.dtop { display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity .25s .2s; }
.deck.on .dtop, .deck.on .dmain { opacity: 1; }
.tabs { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: #0a0f1a; border: 1px solid var(--line); }
.tab { font-size: 11px; font-weight: 600; color: var(--dim); padding: 4px 9px; border-radius: 999px; cursor: pointer; border: 0; background: none; }
.tab.on { background: var(--teal); color: #062a28; box-shadow: 0 0 10px rgba(57,197,187,.45); }
.x { margin-left: auto; color: var(--dim); background: none; border: 0; font-size: 15px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--teal); background: rgba(57,197,187,.1); }
.dmain { flex: 1; display: flex; gap: 8px; min-height: 0; opacity: 0; transition: opacity .25s .25s; }
.dmain canvas { width: 116px; height: 100%; flex: none; }
.dbody { flex: 1; background: rgba(10,15,26,.92); border: 1px solid var(--line); border-radius: 16px; padding: 10px 13px; }
.dt { font-size: 12.5px; font-weight: 800; letter-spacing: .14em; color: var(--teal); margin-bottom: 6px; display: flex; }
.dt span { margin-left: auto; font: 500 10.5px Consolas, monospace; color: var(--dim); letter-spacing: 0; }
.row { display: grid; grid-template-columns: 40px 1fr 80px; gap: 8px; align-items: center; font-size: 12px; padding: 4px 0; border-top: 1px solid #18213a; }
.bar { height: 7px; border-radius: 4px; background: #1a2238; overflow: hidden; } .bar i { display: block; height: 100%; border-radius: 4px; transition: width .6s var(--ease); }
.val { text-align: right; font: 500 11px Consolas, monospace; color: #cfd8e3; }

/* controls */
.ctrl { width: 100%; max-width: 1100px; display: flex; flex-wrap: wrap; gap: 8px; }
.ctrl button { font: 600 12.5px "Segoe UI", system-ui, sans-serif; padding: 8px 13px; border-radius: 10px; border: 1px solid #26324c; background: #121a2b; color: var(--ink); cursor: pointer; transition: border-color .15s, background .15s; }
.ctrl button:hover { border-color: var(--teal); background: #16213a; }
.ctrl button.on { border-color: var(--teal); background: rgba(57,197,187,.14); }
.ctrl .sep { width: 1px; background: #26324c; margin: 0 4px; }
.status { width: 100%; max-width: 1100px; font: 500 12px Consolas, monospace; color: var(--dim); }
body.still *, body.still *::before, body.still *::after { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
@media (max-width: 640px) { .card { width: calc(100vw - 40px); } .deck { width: calc(100vw - 40px); } .window { display: none; } }
</style>
</head>
<body>
<h1>Miku Notch: <span>prototipe interaktif</span></h1>
<p class="hint">Klik tombol di bawah buat simulasi. Kartu notif nutup sendiri setelah 6 detik (hover = ditahan), lalu Miku turun ke bawah kapsul sampai kamu klik dia. Klik kapsul = buka deck. Miku digambar pakai engine chibi asli dari app.</p>

<div class="desk" id="desk">
  <div class="window"><i></i><i style="width:70%"></i><i></i><i style="width:55%"></i><i></i><i style="width:80%"></i></div>
  <div class="island">
    <div class="capsule" id="capsule" title="Buka deck">
      <canvas class="head" id="head"></canvas>
      <span class="slot" id="slot"></span>
    </div>
    <div class="under" id="under" title="Buka">
      <span class="thread"></span>
      <canvas id="hang"></canvas>
      <div class="sign" id="sign"></div>
    </div>
    <div class="card" id="card"><canvas id="cardMiku"></canvas><div class="nb" id="cardBody"></div></div>
    <div class="deck" id="deck">
      <div class="dtop">
        <div class="tabs"><button class="tab on">PC</button><button class="tab">Music</button><button class="tab">Chat</button><button class="tab">Agents</button></div>
        <button class="x" id="deckClose" title="Tutup">✕</button>
      </div>
      <div class="dmain"><canvas id="deckMiku"></canvas>
        <div class="dbody"><div class="dt">PC SPECS<span id="up">Up 6h 12m</span></div><div id="rows"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="ctrl" id="ctrl">
  <button data-a="wa">💬 WA masuk</button>
  <button data-a="line">💬 LINE (Jepang)</button>
  <button data-a="wakr">💬 WA (Korea)</button>
  <button data-a="discord">🎮 Discord mention</button>
  <span class="sep"></span>
  <button data-a="ask">✋ Agen minta izin</button>
  <button data-a="done">✓ Agen selesai</button>
  <span class="sep"></span>
  <button data-a="music" id="musicBtn">🎵 Lagu</button>
  <button data-a="focus" id="focusBtn">🔕 Mode fokus</button>
  <button data-a="read">↺ Baca semua</button>
</div>
<div class="status" id="status"></div>

</script>
<script>
const { drawChibi, CHIBI_W, CHIBI_H } = window.MikuChibi;
const $ = (id) => document.getElementById(id);
const VARIANT = "classic";

// ── Drawing Miku on a canvas, every frame ────────────────────────────────────
const canvases = [];
function miku(canvas, getPose, crop) {
  canvases.push({ canvas, getPose, crop });
}
const t0 = performance.now();
function frame(now) {
  for (const { canvas, getPose, crop } of canvases) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) continue;
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(w * dpr)) canvas.width = Math.round(w * dpr);
    if (canvas.height !== Math.round(h * dpr)) canvas.height = Math.round(h * dpr);
    const x = canvas.getContext("2d");
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.clearRect(0, 0, canvas.width, canvas.height);
    if (crop) {
      // Head only: zoom on the face.
      const k = canvas.width / 260;
      x.setTransform(k, 0, 0, k, -130 * k, -150 * k);
    } else {
      const k = Math.min(canvas.width / CHIBI_W, canvas.height / CHIBI_H);
      x.setTransform(k, 0, 0, k, (canvas.width - CHIBI_W * k) / 2, canvas.height - CHIBI_H * k);
    }
    drawChibi(x, getPose(), (now - t0) / 1000, VARIANT, { noShadow: true });
  }
  requestAnimationFrame(frame);
}

// ── State ────────────────────────────────────────────────────────────────────
const state = {
  music: false, focus: false,
  unread: { wa: 0, line: 0, discord: 0 }, senders: [],
  ask: false, done: false, held: 0,
  cardPose: "idle", deck: false,
};

// What hangs under the capsule: the most important thing not yet seen.
function pending() {
  if (state.ask) return { pose: "approval", col: "#ffd36b", pulse: true,
    html: `<span style="color:#ffd36b">✋ Codex minta izin</span><small>./gradlew assembleRelease</small>` };
  const u = state.unread, total = u.wa + u.line + u.discord;
  if (total) return { pose: "approval", col: "#25d366",
    html: `💬 Pesan${u.wa ? `<span class="bdg" style="background:#25d366">${u.wa}</span>` : ""}${u.line ? `<span class="bdg" style="background:#06c755">${u.line}</span>` : ""}${u.discord ? `<span class="bdg" style="background:#5865f2;color:#fff">${u.discord}</span>` : ""}<small>${[...new Set(state.senders)].slice(-3).join(", ")}</small>` };
  if (state.done) return { pose: "finished", col: "#5fd37a",
    html: `<span style="color:#5fd37a">✓ Claude selesai</span><small>12 file · 4m 12s</small>` };
  if (state.held) return { pose: "sleeping", col: "#8fa3b8",
    html: `🔕 ${state.held} notif ditahan<small>Mode fokus</small>` };
  return null;
}

function renderCapsule() {
  const now = new Date();
  const time = now.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  $("slot").innerHTML = state.music
    ? `<span class="cover"></span><span style="max-width:120px;overflow:hidden;text-overflow:ellipsis">Bokutachi No Uta</span><span class="eq">${"<i></i>".repeat(6)}</span>`
    : `<span class="mono">${time}</span><span class="dimt">·</span><span>☁ 27°</span>`;
}

function renderUnder() {
  const p = pending();
  const under = $("under");
  if (p && !state.cardOpen && !state.deck) {
    $("sign").innerHTML = p.html;
    $("sign").style.setProperty("--b", p.col);
    $("sign").classList.toggle("pulse", !!p.pulse);
    under.classList.add("on");
  } else {
    under.classList.remove("on");
  }
  $("status").textContent = `belum dilihat → WA ${state.unread.wa} · LINE ${state.unread.line} · Discord ${state.unread.discord} · izin ${state.ask ? 1 : 0} · selesai ${state.done ? 1 : 0} · ditahan ${state.held}`;
}

// ── The notification card ────────────────────────────────────────────────────
let cardTimer = null, hovering = false;
const card = $("card");
card.addEventListener("mouseenter", () => { hovering = true; clearTimeout(cardTimer); });
card.addEventListener("mouseleave", () => { hovering = false; scheduleClose(4000); });
function scheduleClose(ms) {
  clearTimeout(cardTimer);
  cardTimer = setTimeout(() => { if (!hovering && !state.askOpen) closeCard(); }, ms);
}
function openCard(n) {
  state.cardOpen = true;
  state.cardPose = n.pose;
  card.style.setProperty("--c", n.col);
  $("cardBody").innerHTML = n.html;
  card.classList.add("on");
  renderUnder();
  card.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => { n.onAct?.(b.dataset.close); closeCard(); }));
  if (!n.sticky) scheduleClose(6000);
}
function closeCard() {
  card.classList.remove("on");
  state.cardOpen = false;
  state.askOpen = false;
  setTimeout(renderUnder, 220);
}

const who = (av, col, name) => `<div class="who"><span class="av" style="background:${col}">${av}</span><span class="name">${name}</span></div>`;
const NOTES = {
  wa: () => ({ key: "wa", sender: "Rina", col: "#25d366", pose: "approval",
    html: `<div class="src">💬 WHATSAPP<span class="t">baru saja</span></div>${who("R", "#25d366", "Rina")}<div class="msg">Bro, build-nya udah bisa di-test belum? 🙏</div><div class="acts"><input class="input" placeholder="Balas…"><button class="btn p" data-close="sent">Kirim</button><button class="btn s" data-close="later">Nanti</button></div>` }),
  line: () => ({ key: "line", sender: "Yuki", col: "#06c755", pose: "finished",
    html: `<div class="src">💬 LINE<span class="t">1 mnt</span></div>${who("Y", "#06c755", "Yuki")}<div class="msg">今夜ライブ行く？ 🎤</div><div class="rom">konya raibu iku?</div><div class="tr">🌐 “Malam ini ke live?”</div><div class="acts"><button class="btn p" data-close="open">Buka di LINE</button><button class="btn s" data-close="later">Tandai dilihat</button></div>` }),
  wakr: () => ({ key: "wa", sender: "Jiwoo", col: "#25d366", pose: "approval",
    html: `<div class="src">💬 WHATSAPP<span class="t">baru saja</span></div>${who("J", "#25d366", "Jiwoo")}<div class="msg">오늘 저녁에 시간 있어?</div><div class="rom">oneul jeonyeoge sigan isseo?</div><div class="tr">🌐 “Malam ini ada waktu?”</div><div class="acts"><input class="input" placeholder="Balas…"><button class="btn p" data-close="sent">Kirim</button></div>` }),
  discord: () => ({ key: "discord", sender: "sora", col: "#5865f2", pose: "approval",
    html: `<div class="src">🎮 DISCORD · @MENTION<span class="t">1 mnt</span></div><div class="who"><span class="av" style="background:#8b93ff">S</span><span class="name">sora</span><span style="font-size:11px;color:var(--dim)">di #dev-miku</span></div><div class="msg"><span style="background:rgba(88,101,242,.25);color:#c9cdff;border-radius:4px;padding:0 3px">@kamu</span> PR-nya keren, boleh aku coba build?</div><div class="acts"><button class="btn p" data-close="open">Buka di Discord</button><button class="btn s" data-close="later">Nanti</button></div>` }),
};

function incoming(kind) {
  const n = NOTES[kind]();
  // Counted until read; "Kirim"/"Buka" reads it.
  state.unread[n.key]++;
  state.senders.push(n.sender);
  n.onAct = (a) => {
    if (a === "sent" || a === "open") { state.unread[n.key] = Math.max(0, state.unread[n.key] - 1); state.senders = state.senders.filter((s) => s !== n.sender); }
  };
  if (state.focus || state.deck) { state.held += state.focus ? 1 : 0; renderUnder(); return; }
  openCard(n);
}

function askPermission() {
  state.ask = true;
  if (state.deck) { renderUnder(); return; }
  state.askOpen = true;
  openCard({ col: "#ffd36b", pose: "approval", sticky: true,
    html: `<div class="src" style="color:#ffd36b">✋ MIKU MINTA IZIN<span class="t">Codex</span></div><div class="msg">Codex mau jalanin:</div><div class="msg mono" style="background:#0b1120;border-radius:8px;padding:6px 9px;margin-top:6px">./gradlew assembleRelease</div><div class="acts"><button class="btn p" data-close="allow">Izinkan</button><button class="btn s" data-close="deny">Tolak</button><button class="btn s" data-close="fold" title="Lipat, jawab nanti">Nanti</button></div>`,
    onAct: (a) => { if (a !== "fold") state.ask = false; } });
}

function agentDone() {
  state.done = true;
  if (state.focus) { state.held++; renderUnder(); return; }
  openCard({ col: "#5fd37a", pose: "finished",
    html: `<div class="src" style="color:#5fd37a">✓ AGEN SELESAI<span class="t">Claude Code</span></div><div class="msg"><b>12 file berubah</b>, semua test lolos</div><div class="msg" style="color:var(--dim)">my-app · 4m 12s · <span style="color:#5fd37a">+412</span> <span style="color:#ff8fb3">−88</span></div><div class="acts"><button class="btn p" data-close="seen">Lihat diff</button><button class="btn s" data-close="later">Nanti</button></div>`,
    onAct: (a) => { if (a === "seen") state.done = false; } });
}

// Clicking Miku under the capsule: open what she holds.
$("under").addEventListener("click", () => {
  const p = pending();
  if (!p) return;
  if (state.ask) return askPermission();
  const u = state.unread;
  if (u.wa + u.line + u.discord) { state.unread = { wa: 0, line: 0, discord: 0 }; state.senders = []; }
  else if (state.done) state.done = false;
  else if (state.held) state.held = 0;
  renderUnder();
});

// The deck.
function deck(on) {
  state.deck = on;
  $("deck").classList.toggle("on", on);
  if (on) { clearTimeout(cardTimer); card.classList.remove("on"); state.cardOpen = false; }
  renderUnder();
}
$("capsule").addEventListener("click", () => deck(true));
$("deckClose").addEventListener("click", () => deck(false));
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
}));
function rows() {
  const r = (k, p, col, v) => `<div class="row"><span>${k}</span><div class="bar"><i style="width:${p}%;background:${col}"></i></div><span class="val">${v}</span></div>`;
  const cpu = 8 + Math.round(Math.random() * 20), ram = 60 + Math.round(Math.random() * 6);
  $("rows").innerHTML = r("CPU", cpu, "#39c5bb", `${cpu}% · 24c`) + r("RAM", ram, "#39c5bb", `${(ram * 0.319).toFixed(1)}/31.9G`)
    + r("Disk", 65, "#5fd37a", "65% · 2589G") + r("Net", 22, "#8fa3ff", "↓24K ↑9K");
}

// Controls.
$("ctrl").addEventListener("click", (e) => {
  const a = e.target.closest("button")?.dataset.a;
  if (!a) return;
  if (NOTES[a]) incoming(a);
  else if (a === "ask") askPermission();
  else if (a === "done") agentDone();
  else if (a === "music") { state.music = !state.music; $("musicBtn").classList.toggle("on", state.music); renderCapsule(); }
  else if (a === "focus") { state.focus = !state.focus; $("focusBtn").classList.toggle("on", state.focus); if (!state.focus) state.held = 0; renderUnder(); }
  else if (a === "read") { Object.assign(state, { unread: { wa: 0, line: 0, discord: 0 }, senders: [], ask: false, done: false, held: 0 }); closeCard(); renderUnder(); }
});

// The Mikus on the page.
miku($("head"), () => (state.music ? "singing" : "idle"), true);
miku($("hang"), () => pending()?.pose ?? "idle");
miku($("cardMiku"), () => state.cardPose);
miku($("deckMiku"), () => (state.music ? "singing" : "idle"));

renderCapsule(); renderUnder(); rows();
setInterval(renderCapsule, 15000);
setInterval(rows, 3000);
requestAnimationFrame(frame);
// ?still&a=wa,close — a fixed scene for checking the layout (no motion).
const q = new URLSearchParams(location.search);
if (q.has("still")) {
  document.body.classList.add("still");
